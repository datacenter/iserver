apiVersion: v1
kind: Secret
metadata:
  name: test-userdata
  namespace: openshift-machine-api
type: Opaque
stringData:
  userData: |
    #cloud-config
    users:
      - name: root
        lock_passwd: false
        ssh_authorized_keys:
          - ssh-ed25519 AAAA... user@hostname
      - name: ubuntu
        lock_passwd: false
        ssh_authorized_keys:
          - ssh-ed25519 AAAA... user@hostname
    chpasswd:
      list: |
        ubuntu:test123
        root:test123
      expire: false
    ssh_pwauth: true
    disable_root: false
    runcmd:
      - systemctl enable --now sshd